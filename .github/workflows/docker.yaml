name: Build and push Docker image

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  IMAGE_NAME: ghcr.io/kemiao-moretti/lsky-pro-frontend

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号唯一来源：config/convention.php 的 AppVersion（后台「关于」显示的那个）
      # 'V 2.1' → 去掉 V 和空格 → 2.1
      - name: Read app version
        id: appver
        run: |
          RAW=$(grep -oP "ConfigKey::AppVersion\s*=>\s*'\K[^']+" config/convention.php || true)
          VER=$(printf '%s' "$RAW" | tr -d '[:space:]' | sed 's/^[Vv]//' | tr -cd '0-9A-Za-z._-')
          if [ -n "$VER" ]; then
            echo "解析到版本号：$VER"
          else
            echo "::warning::config/convention.php 里没解析到 AppVersion（读到：$RAW），本次只打 latest"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # latest 恒定产出；版本号解析失败时该行解析为空行，不会被当成标签
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ steps.appver.outputs.version && format('{0}:{1}', env.IMAGE_NAME, steps.appver.outputs.version) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
